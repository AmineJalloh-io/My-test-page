<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>AfriPay · Interactive Guide</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .guide-card {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      padding: 1.8rem 1.5rem 1.5rem;
      transition: all 0.2s;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 20px;
      background: #d0dce8;
      transition: 0.25s;
    }
    .step-dot.active {
      background: #0f2b3d;
      width: 28px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0a2b3c;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.25rem;
      min-height: 3rem;
    }
    .page-sub {
      color: #2c7da0;
      font-weight: 500;
      margin-bottom: 0.8rem;
      border-left: 3px solid #f4a261;
      padding-left: 10px;
      min-height: 2rem;
    }
    .content-box {
      background: #f7fafc;
      border-radius: 1.2rem;
      padding: 1.2rem 1.2rem;
      min-height: 160px;
      border: 1px solid #e2edf7;
      margin-bottom: 0.8rem;
      line-height: 1.8;
      color: #1e3b4a;
      transition: background 0.2s;
      position: relative;
    }
    .content-box.animating {
      background: #fefcf5;
      border-color: #f4a261;
    }
    .content-box strong {
      color: #0f2b3d;
    }
    .content-box .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #f4a261;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .step-list {
      padding-left: 1.4rem;
      margin: 0.4rem 0;
    }
    .step-list li {
      margin-bottom: 0.3rem;
    }

    /* Video overlay - Slideshow style */
    .video-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 1rem;
    }
    .video-overlay.open {
      display: flex;
    }
    .video-overlay .slide-container {
      max-width: 800px;
      width: 100%;
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      border-radius: 24px;
      padding: 2rem 2rem 1.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      position: relative;
      min-height: 350px;
      display: flex;
      flex-direction: column;
    }
    .video-overlay .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      color: #88ccff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .video-overlay .slide-step-counter {
      background: rgba(255,255,255,0.08);
      padding: 0.2rem 1rem;
      border-radius: 30px;
      border: 1px solid rgba(136,204,255,0.2);
    }
    .video-overlay .slide-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin-bottom: 0.8rem;
      overflow: hidden;
    }
    .video-overlay .slide-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2c7da0, #f4a261);
      border-radius: 4px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .video-overlay .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem 0.5rem;
      min-height: 200px;
    }
    .video-overlay .slide-icon {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
    }
    .video-overlay .slide-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-bottom: 0.6rem;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .video-overlay .slide-desc {
      font-size: 1.1rem;
      color: #c8d6e5;
      text-align: center;
      max-width: 90%;
      line-height: 1.6;
      opacity: 0.9;
    }
    .video-overlay .slide-dots {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 0.8rem;
    }
    .video-overlay .slide-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: 0.3s;
      cursor: pointer;
    }
    .video-overlay .slide-dot.active {
      background: #f4a261;
      width: 24px;
      border-radius: 10px;
    }
    .video-overlay .slide-controls {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }
    .video-overlay .slide-controls button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.85rem;
      height: 38px;
    }
    .video-overlay .slide-controls button:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.03);
    }
    .video-overlay .slide-controls button.primary {
      background: #f4a261;
      border-color: #f4a261;
    }
    .video-overlay .slide-controls button.primary:hover {
      background: #e08e4a;
    }
    .video-overlay .slide-controls button.close-btn {
      background: #e74c3c;
      border-color: #e74c3c;
    }
    .video-overlay .slide-controls button.close-btn:hover {
      background: #c0392b;
    }
    .video-overlay .slide-voice-status {
      color: #88ccff;
      font-size: 0.7rem;
      opacity: 0.7;
      text-align: center;
      margin-top: 0.3rem;
    }

    .action-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.6rem 0;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f2b3d;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
      height: 40px;
    }
    .action-btn:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }
    .action-btn.whatsapp { background: #25D366; }
    .action-btn.whatsapp:hover { background: #1da851; }
    .action-btn.nusapp { background: #6c3b9e; }
    .action-btn.nusapp:hover { background: #522b7a; }
    .action-btn.xender { background: #FF6B00; }
    .action-btn.xender:hover { background: #cc5500; }
    .action-btn.bluetooth { background: #0088cc; }
    .action-btn.bluetooth:hover { background: #006699; }
    .action-btn.cloud { background: #2980b9; }
    .action-btn.cloud:hover { background: #1f6d99; }
    .action-btn.usb { background: #e67e22; }
    .action-btn.usb:hover { background: #cc6a1a; }

    .audio-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin: 0.4rem 0 0.2rem;
      background: #f0f6fb;
      padding: 0.5rem 0.8rem;
      border-radius: 60px;
      border: 1px solid #dce8f0;
    }
    .audio-row select {
      background: white;
      border: 1px solid #d0dce8;
      border-radius: 30px;
      padding: 0.2rem 0.8rem;
      font-weight: 600;
      height: 36px;
      outline: none;
      font-size: 0.85rem;
    }
    .audio-btn, .video-btn {
      background: #0f2b3d;
      border: none;
      color: white;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      height: 40px;
      font-size: 0.95rem;
    }
    .video-btn {
      background: #8e44ad;
    }
    .video-btn:hover {
      background: #732d91;
      transform: scale(1.01);
    }
    .audio-btn:hover {
      background: #f4a261;
      transform: scale(1.01);
    }
    .audio-btn:disabled, .video-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .audio-status {
      font-size: 0.75rem;
      color: #2c7da0;
      margin-left: 6px;
      font-weight: 500;
    }
    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .nav-btn {
      background: #eef2f7;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 700;
      color: #1c6e8f;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 46px;
      font-size: 1rem;
    }
    .nav-btn.primary {
      background: #0f2b3d;
      color: white;
    }
    .nav-btn.primary:hover {
      background: #f4a261;
    }
    .nav-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    .page-counter {
      font-weight: 600;
      color: #2c7da0;
    }

    @media (max-width: 480px) {
      .guide-card { padding: 1.2rem 1rem; }
      .page-title { font-size: 1.4rem; }
      .audio-row { flex-direction: column; align-items: stretch; }
      .btn-row { flex-direction: column; }
      .btn-row .audio-btn, .btn-row .video-btn { width: 100%; justify-content: center; }
      .nav-row { flex-direction: column; }
      .nav-btn { width: 100%; justify-content: center; }
      .content-box { padding: 0.8rem; min-height: 120px; }
      .action-btn-group { flex-direction: column; }
      .action-btn { width: 100%; justify-content: center; }
      .video-overlay .slide-container { padding: 1.2rem; min-height: 280px; }
      .video-overlay .slide-title { font-size: 1.3rem; }
      .video-overlay .slide-desc { font-size: 0.9rem; }
      .video-overlay .slide-icon { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
<div class="guide-card" id="guideApp">
  <div class="step-indicator" id="stepDots"></div>

  <div id="pageContainer">
    <div class="page-title" id="pageTitle">🌍 AfriPay</div>
    <div class="page-sub" id="pageSub">Cross‑border mobile money hub</div>
    <div class="content-box" id="pageContent">
      <p><strong>AfriPay</strong> connects West Africa through instant Orange Money, Afrimoney, QMoney and WBMoney transfers.</p>
      <p style="margin-top:0.4rem;">🌐 <span class="highlight">Developer:</span> <strong>Mohamed Amine Jalloh</strong> · NUSWEB</p>
    </div>

    <div class="audio-row">
      <select id="audioLangSelect">
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
      </select>
      <div class="btn-row">
        <button class="audio-btn" id="playAudioBtn">🔊 Play Audio</button>
        <button class="video-btn" id="playVideoBtn">🎬 Slideshow</button>
      </div>
      <span class="audio-status" id="audioStatus">Ready</span>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" disabled>◀ Back</button>
    <span class="page-counter" id="pageCounter">1 / 9</span>
    <button class="nav-btn primary" id="nextBtn">Next ▶</button>
  </div>
</div>

<!-- Video Overlay - Slideshow -->
<div class="video-overlay" id="videoOverlay">
  <div class="slide-container">
    <div class="slide-header">
      <span class="slide-step-counter" id="slideStepCounter">Step 1 of 6</span>
      <span style="color:rgba(255,255,255,0.4); font-size:0.7rem;" id="slideLangDisplay">🇬🇧 English</span>
    </div>
    <div class="slide-progress-bar">
      <div class="slide-progress-fill" id="slideProgressFill"></div>
    </div>
    <div class="slide-content" id="slideContent">
      <div class="slide-icon" id="slideIcon">📱</div>
      <div class="slide-title" id="slideTitle">Welcome to AfriPay</div>
      <div class="slide-desc" id="slideDesc">Loading slideshow...</div>
    </div>
    <div class="slide-dots" id="slideDots"></div>
    <div class="slide-controls">
      <button id="slidePrevBtn">◀ Prev</button>
      <button class="primary" id="slidePlayBtn">⏸ Pause</button>
      <button id="slideNextBtn">Next ▶</button>
      <button class="close-btn" id="slideCloseBtn">✕ Close</button>
    </div>
    <div class="slide-voice-status" id="slideVoiceStatus">🔊 Voice narration ready</div>
  </div>
</div>

        pages: [
          { title: 'أفري باي', sub: 'مركز التحويلات المالية عبر الحدود', content: `<p><strong>أفري باي</strong> هو مركز دفع لغرب أفريقيا. يتيح التحويلات الفورية عبر <strong>أورانج موني، أفري موني، كيو موني و دبليو بي موني</strong>.</p><p style="margin-top:0.6rem;">المطور: <strong>محمد أمين جالو</strong> · NUSWEB للتقنيات المالية</p><p style="margin-top:0.4rem;">تم تصميمه لسيراليون، غينيا، السنغال، غانا، ليبيريا، والمزيد.</p>`, steps: [{icon:'🌍',title:'أفري باي',desc:'مركز دفع لغرب أفريقيا'},{icon:'📱',title:'التحويلات المالية',desc:'تحويلات فورية عبر أورانج موني، أفري موني، كيو موني و دبليو بي موني'},{icon:'👨‍💻',title:'المطور',desc:'محمد أمين جالو · NUSWEB'},{icon:'🌍',title:'الدول المدعومة',desc:'سيراليون، غينيا، السنغال، غانا، ليبيريا'}] },
          { title: 'الوكيل والضمان', sub: 'تسجيل آمن للوكيل مع ضمان', content: `<p><strong>تسجيل الوكيل</strong> يتطلب اسم تجاري، هوية، وحد ضمان يصل إلى 10,000.</p><p style="margin-top:0.4rem;">الضمان يحمي العملاء. إذا فشل الوكيل في التسليم، يعوض المطور العميل من الضمان.</p><p style="margin-top:0.4rem;">يوقع الوكلاء اتفاقية رقمية ويحصلون على <strong>عمولة 7 بالمئة</strong> على التحويلات و <strong>12 بالمئة</strong> على السحب النقدي.</p>`, steps: [{icon:'🏢',title:'تسجيل الوكيل',desc:'يتطلب اسم تجاري، هوية، حد ضمان'},{icon:'🛡️',title:'حماية الضمان',desc:'الضمان يحمي العملاء'},{icon:'📜',title:'الاتفاقية الرقمية',desc:'يوقع الوكلاء اتفاقية رقمية'},{icon:'💰',title:'العمولة',desc:'7% على التحويلات، 12% على السحب'}] },
          { title: 'أسعار حية وإيصالات', sub: 'محول عملات فوري وإيصالات رقمية', content: `<p><strong>محول العملات</strong> يستخدم أسعار صرف حية مع الدولار كقاعدة. احسب الرسوم بما في ذلك 4 بالمئة رسوم تحويل وضريبة القيمة المضافة.</p><p style="margin-top:0.4rem;">كل معاملة تولد إيصالاً مع معرف المعاملة، معرف مزود الخدمة، ورمز التحويل.</p><p style="margin-top:0.4rem;">يدعم أكثر من 20 دولة برموز USSD ديناميكية.</p>`, steps: [{icon:'💱',title:'محول العملات',desc:'أسعار صرف حية مع الدولار كقاعدة'},{icon:'📊',title:'حساب الرسوم',desc:'4% رسوم تحويل + ضريبة القيمة المضافة'},{icon:'🧾',title:'الإيصالات الرقمية',desc:'الإيصال يشمل معرف المعاملة ورمز التحويل'},{icon:'🌍',title:'دعم متعدد الدول',desc:'يدعم 20+ دولة برموز USSD'}] },
          { title: 'تحميل أفري باي', sub: 'تحميل وتثبيت التطبيق', content: `<p><strong>كيف تحصل على أفري باي:</strong></p><div class="action-btn-group"><button class="action-btn nusapp" id="nusappBtn">📦 NUSAPPSTORE</button><button class="action-btn whatsapp" id="whatsappBtn">💬 واتساب</button><button class="action-btn xender" id="xenderBtn">📤 Xender</button><button class="action-btn bluetooth" id="bluetoothBtn">📡 بلوتوث</button><button class="action-btn usb" id="usbBtn">📁 USB</button><button class="action-btn cloud" id="cloudBtn">☁️ سحابة</button></div><ul class="step-list"><li><strong>NUSAPPSTORE</strong> – حمل تطبيق NUSAPPSTORE ثم ثبّت أفري باي.</li><li><strong>واتساب</strong> – أرسل رسالة إلى <strong>+23276436811</strong> لطلب APK.</li><li><strong>Xender</strong> – استخدم Xender للنقل المباشر.</li><li><strong>بلوتوث</strong> – استخدم البلوتوث لمشاركة الملف.</li><li><strong>USB أو OTG</strong> – انسخ من قرص USB.</li><li><strong>سحابة</strong> – شارك عبر Google Drive أو Dropbox.</li></ul>`, steps: [{icon:'📦',title:'NUSAPPSTORE',desc:'تحميل NUSAPPSTORE ثم تثبيت أفري باي'},{icon:'💬',title:'واتساب',desc:'إرسال رسالة إلى +23276436811'},{icon:'📤',title:'Xender',desc:'استخدام Xender للنقل المباشر'},{icon:'📡',title:'بلوتوث',desc:'استخدام البلوتوث لمشاركة الملف'},{icon:'📁',title:'USB',desc:'النسخ من قرص USB'},{icon:'☁️',title:'سحابة',desc:'المشاركة عبر Google Drive أو Dropbox'}] },
          { title: 'إنشاء حساب مستخدم', sub: 'التسجيل خطوة بخطوة', content: `<p><strong>خطوات إنشاء حساب مستخدم:</strong></p><ol class="step-list"><li>افتح تطبيق أفري باي واضغط <strong>تسجيل</strong>.</li><li>أدخل <strong>الاسم الكامل</strong> و <strong>رقم الهاتف</strong> مع رمز البلد.</li><li>املأ <strong>العنوان</strong> واختر <strong>المدينة</strong>.</li><li>اختر <strong>البلد</strong> من القائمة.</li><li>اختر <strong>أيقونة الملف الشخصي</strong> أو حمّل صورتك.</li><li>اضغط <strong>تسجيل</strong> – يتم إنشاء حسابك فوراً.</li><li>يمكنك الآن <strong>تسجيل الدخول</strong> باسمك ورقم هاتفك.</li></ol>`, steps: [{icon:'📱',title:'فتح التطبيق',desc:'فتح أفري باي والضغط على تسجيل'},{icon:'✏️',title:'إدخال البيانات',desc:'الاسم الكامل ورقم الهاتف مع رمز البلد'},{icon:'📍',title:'العنوان والمدينة',desc:'ملأ العنوان واختيار المدينة'},{icon:'🌍',title:'اختيار البلد',desc:'اختيار البلد من القائمة'},{icon:'🖼️',title:'أيقونة الملف الشخصي',desc:'اختيار أيقونة أو تحميل صورة'},{icon:'✅',title:'تسجيل',desc:'الضغط على تسجيل – إنشاء الحساب فوراً'},{icon:'🔑',title:'تسجيل الدخول',desc:'تسجيل الدخول بالاسم ورقم الهاتف'}] },
          { title: 'إنشاء حساب وكيل (ملخص)', sub: 'تسجيل الوكيل خطوة بخطوة - ملخص', content: `<p><strong>خطوات سريعة لإنشاء حساب وكيل:</strong></p><ol class="step-list"><li>اضغط <strong>تسجيل</strong> ثم اختر <strong>تسجيل كـ وكيل</strong>.</li><li>املأ <strong>الاسم التجاري، العنوان، المدينة، ورقم التسجيل</strong>.</li><li>اختر <strong>نوع النشاط</strong> وأدخل <strong>اسم المالك</strong>.</li><li>قدّم <strong>نوع الهوية ورقم الهوية</strong> وحمّل صورة الهوية.</li><li>أدخل <strong>رقم الهاتف المحمول</strong>.</li><li>حدد <strong>حد الضمان</strong> وولّد كلمة مرور و PIN.</li><li>اضغط <strong>إنشاء USSD</strong> لرمز دفع الضمان.</li><li>اقرأ و <strong>وقّع اتفاقية الوكيل</strong>.</li><li>اضغط <strong>تسجيل الوكيل</strong> – إرسال للموافقة.</li></ol><p style="margin-top:0.4rem;">للحصول على دليل تفصيلي خطوة بخطوة مع توقيع الاتفاقية، انظر الصفحة التالية.</p>`, steps: [{icon:'🏢',title:'بدء التسجيل',desc:'الضغط على تسجيل ثم تسجيل كـ وكيل'},{icon:'📝',title:'بيانات النشاط',desc:'الاسم التجاري، العنوان، المدينة، رقم التسجيل'},{icon:'👤',title:'المالك والنوع',desc:'نوع النشاط واسم المالك'},{icon:'🪪',title:'رفع الهوية',desc:'نوع الهوية ورقم الهوية وتحميل الصورة'},{icon:'📱',title:'الهاتف المحمول',desc:'إدخال رقم الهاتف المحمول'},{icon:'🔐',title:'الأمان',desc:'حد الضمان، كلمة مرور و PIN'},{icon:'📞',title:'إنشاء USSD',desc:'إنشاء USSD لرمز دفع الضمان'},{icon:'✍️',title:'التوقيع',desc:'قراءة وتوقيع اتفاقية الوكيل'},{icon:'✅',title:'إرسال',desc:'تسجيل الوكيل – إرسال للموافقة'}] },
          { title: 'تفاصيل تسجيل الوكيل', sub: 'دليل كامل يشمل توقيع الاتفاقية', content: `<p><strong>خطوات تفصيلية لإنشاء حساب وكيل:</strong></p><ol class="step-list"><li>افتح تطبيق أفري باي واضغط <strong>تسجيل</strong>.</li><li>اختر <strong>تسجيل كـ وكيل</strong>.</li><li>املأ <strong>الاسم التجاري</strong>، <strong>العنوان التجاري</strong>، <strong>المدينة</strong>، و <strong>رقم التسجيل الرسمي</strong>.</li><li>اختر <strong>نوع النشاط التجاري</strong> وأدخل <strong>اسم المالك الكامل</strong>.</li><li>اختر <strong>نوع الهوية</strong> وأدخل <strong>رقم الهوية</strong>. حمّل صورة واضحة للهوية.</li><li>أدخل <strong>رقم الهاتف المحمول</strong> (الرقم المرتبط بحساب أورانج موني أو أفري موني).</li><li>حدد <strong>حد الضمان</strong> (الحد الأقصى للمعاملة). وولّد <strong>كلمة مرور من 6 أحرف</strong> و <strong>رقم PIN من 5 أرقام</strong>.</li><li>اضغط <strong>إنشاء USSD</strong> لإنشاء رمز دفع الضمان.</li><li><strong>اقرأ اتفاقية الوكيل</strong> بعناية. تحدد التزاماتك، ونسب العمولة (7% على التحويلات، 12% على السحب)، وسياسة الضمان.</li><li><strong>وقّع الاتفاقية</strong> برسم توقيعك على اللوحة المقدمة في التطبيق.</li><li>بعد التوقيع، اضغط <strong>تسجيل الوكيل</strong> لإرسال طلبك للموافقة.</li><li>ستتلقى تأكيداً وسيتم تفعيل حسابك بعد مراجعة المدير.</li></ol><p style="margin-top:0.4rem;">يحصل الوكلاء على <strong>عمولة 7%</strong> على التحويلات و <strong>12%</strong> على السحب.</p>`, steps: [{icon:'📱',title:'فتح التطبيق وتسجيل',desc:'فتح أفري باي، الضغط على تسجيل، اختيار تسجيل كـ وكيل'},{icon:'📝',title:'بيانات النشاط',desc:'الاسم التجاري، العنوان، المدينة، رقم التسجيل'},{icon:'👤',title:'المالك والنوع',desc:'نوع النشاط واسم المالك الكامل'},{icon:'🪪',title:'رفع الهوية',desc:'نوع الهوية، رقم الهوية، وتحميل الصورة'},{icon:'📱',title:'الهاتف المحمول',desc:'إدخال رقم الهاتف المحمول'},{icon:'🔐',title:'إعدادات الأمان',desc:'حد الضمان، كلمة مرور 6 أحرف، PIN 5 أرقام'},{icon:'📞',title:'إنشاء USSD',desc:'إنشاء USSD لرمز دفع الضمان'},{icon:'📜',title:'قراءة الاتفاقية',desc:'قراءة اتفاقية ال           { title: 'إرسال الأموال محلياً', sub: 'دليل التحويل المحلي خطوة بخطوة', content: `<p><strong>كيف ترسل الأموال محلياً:</strong></p><ol class="step-list"><li><strong>سجل الدخول</strong> إلى حسابك.</li><li><strong>بيانات المرسل</strong> تملأ تلقائياً من حسابك المسجل.</li><li>اختر <strong>وكيلاً مسجلاً</strong> من القائمة.</li><li>أدخل <strong>المبلغ</strong> – تطبق رسوم 4%.</li><li>اختر <strong>مشغل الهاتف المحمول</strong>.</li><li>اضغط لإنشاء <strong>رمز USSD</strong>.</li><li>أدخل <strong>رقم PIN</strong> لإكمال المعاملة.</li><li>ستتلقى <strong>إيصالاً رقمياً</strong>.</li></ol>`, steps: [{icon:'🔑',title:'تسجيل الدخول',desc:'تسجيل الدخول إلى حسابك'},{icon:'✏️',title:'بيانات المرسل مملوءة',desc:'الاسم، الهاتف، العنوان والمدينة تملأ تلقائياً'},{icon:'👤',title:'اختيار الوكيل',desc:'اختيار وكيل مسجل من القائمة'},{icon:'💰',title:'المبلغ',desc:'إدخال المبلغ – رسوم 4%'},{icon:'📱',title:'اختيار المشغل',desc:'اختيار مشغل الهاتف المحمول'},{icon:'📞',title:'إنشاء USSD',desc:'إنشاء رمز USSD'},{icon:'🔐',title:'إدخال PIN',desc:'إدخال رقم PIN'},{icon:'🧾',title:'الإيصال',desc:'استلام إيصال رقمي'}] },
          { title: 'إرسال الأموال دولياً', sub: 'دليل التحويل الدولي خطوة بخطوة', content: `<p><strong>كيف ترسل الأموال دولياً:</strong></p><ol class="step-list"><li><strong>سجل الدخول</strong> إلى حسابك.</li><li><strong>بيانات المرسل</strong> تملأ تلقائياً من حسابك المسجل.</li><li>اضغط زر <strong>دولي</strong>.</li><li>تحقق من <strong>شريط الأعلام</strong> – اختر وكيلاً يتطابق مع دولة المستلم.</li><li>اختر <strong>دولة المستلم</strong> – تحديث الضريبة والعملة.</li><li>أدخل <strong>المبلغ</strong> – تطبق رسوم 4% + ضريبة القيمة المضافة.</li><li>اختر <strong>مشغل الهاتف المحمول</strong>.</li><li>أنشئ <strong>رمز USSD دولي</strong>.</li><li>أدخل <strong>رقم PIN</strong> لإكمال المعاملة.</li><li>ستتلقى <strong>إيصالاً رقمياً</strong> مع سعر الصرف.</li></ol>`, steps: [{icon:'🔑',title:'تسجيل الدخول',desc:'تسجيل الدخول إلى حسابك'},{icon:'✏️',title:'بيانات المرسل مملوءة',desc:'الاسم، الهاتف، العنوان والمدينة تملأ تلقائياً'},{icon:'🌍',title:'الوضع الدولي',desc:'الضغط على زر دولي'},{icon:'🏳️',title:'اختيار الوكيل',desc:'اختيار وكيل يتطابق مع دولة المستلم'},{icon:'🌍',title:'دولة المستلم',desc:'اختيار دولة المستلم – تحديث الضريبة والعملة'},{icon:'💰',title:'المبلغ',desc:'إدخال المبلغ – رسوم 4% + ضريبة القيمة المضافة'},{icon:'📱',title:'اختيار المشغل',desc:'اختيار مشغل الهاتف المحمول'},{icon:'📞',title:'إنشاء USSD',desc:'إنشاء رمز USSD دولي'},{icon:'🔐',title:'إدخال PIN',desc:'إدخال رقم PIN'},{icon:'🧾',title:'الإيصال',desc:'استلام إيصال مع سعر الصرف'}] }

      fr: {
        pages: [
          { title: 'AfriPay', sub: 'Plateforme de transfert d\'argent transfrontalier', content: `<p><strong>AfriPay</strong> est une plateforme de paiement pour l\'Afrique de l\'Ouest. Elle permet des transferts instantanés via <strong>Orange Money, Afrimoney, QMoney et WBMoney</strong>.</p><p style="margin-top:0.6rem;">Développeur: <strong>Mohamed Amine Jalloh</strong> · NUSWEB</p><p style="margin-top:0.4rem;">Conçu pour la Sierra Leone, la Guinée, le Sénégal, le Ghana, le Liberia.</p>`, steps: [{icon:'🌍',title:'AfriPay',desc:'Plateforme de paiement pour l\'Afrique de l\'Ouest'},{icon:'📱',title:'Transferts',desc:'Transferts via Orange Money, Afrimoney, QMoney et WBMoney'},{icon:'👨‍💻',title:'Développeur',desc:'Mohamed Amine Jalloh · NUSWEB'},{icon:'🌍',title:'Pays',desc:'Sierra Leone, Guinée, Sénégal, Ghana, Liberia'}] },
          { title: 'Agent et Garantie', sub: 'Inscription sécurisée des agents', content: `<p><strong>L\'inscription d\'un agent</strong> nécessite un nom commercial, une pièce d\'identité, et une limite de garantie jusqu\'à 10 000.</p><p style="margin-top:0.4rem;">La garantie protège les clients. Si un agent ne livre pas, le développeur compense le client.</p><p style="margin-top:0.4rem;">Les agents reçoivent <strong>7% de commission</strong> sur les transferts et <strong>12%</strong> sur les retraits.</p>`, steps: [{icon:'🏢',title:'Inscription agent',desc:'Nom commercial, ID, limite de garantie'},{icon:'🛡️',title:'Garantie',desc:'Protège les clients'},{icon:'📜',title:'Accord',desc:'Accord numérique signé'},{icon:'💰',title:'Commission',desc:'7% transferts, 12% retraits'}] },
          { title: 'Taux en direct et Reçus', sub: 'Convertisseur de devises en temps réel', content: `<p><strong>Convertisseur de devises</strong> avec taux en direct. Frais: 4% de transfert + TVA.</p><p style="margin-top:0.4rem;">Reçu avec ID transaction, ID fournisseur, code transfert.</p><p style="margin-top:0.4rem;">20+ pays avec codes USSD dynamiques.</p>`, steps: [{icon:'💱',title:'Convertisseur',desc:'Taux en direct avec USD'},{icon:'📊',title:'Frais',desc:'4% de transfert + TVA'},{icon:'🧾',title:'Reçu',desc:'ID transaction, code transfert'},{icon:'🌍',title:'Pays',desc:'20+ pays avec codes USSD'}] },
          { title: 'Obtenir AfriPay', sub: 'Télécharger et installer', content: `<p><strong>Comment obtenir AfriPay:</strong></p><div class="action-btn-group"><button class="action-btn nusapp" id="nusappBtn">📦 NUSAPPSTORE</button><button class="action-btn whatsapp" id="whatsappBtn">💬 WhatsApp</button><button class="action-btn xender" id="xenderBtn">📤 Xender</button><button class="action-btn bluetooth" id="bluetoothBtn">📡 Bluetooth</button><button class="action-btn usb" id="usbBtn">📁 USB</button><button class="action-btn cloud" id="cloudBtn">☁️ Cloud</button></div><ul class="step-list"><li><strong>NUSAPPSTORE</strong> – téléchargez NUSAPPSTORE puis AfriPay.</li><li><strong>WhatsApp</strong> – message <strong>+23276436811</strong> pour l'APK.</li><li><strong>Xender</strong> – transfert direct.</li><li><strong>Bluetooth</strong> – partage de fichier.</li><li><strong>USB ou OTG</strong> – copie depuis clé USB.</li><li><strong>Cloud</strong> – Google Drive, Dropbox.</li></ul>`, steps: [{icon:'📦',title:'NUSAPPSTORE',desc:'Télécharger NUSAPPSTORE puis AfriPay'},{icon:'💬',title:'WhatsApp',desc:'Message +23276436811'},{icon:'📤',title:'Xender',desc:'Transfert direct'},{icon:'📡',title:'Bluetooth',desc:'Partage de fichier'},{icon:'📁',title:'USB',desc:'Copie depuis clé USB'},{icon:'☁️',title:'Cloud',desc:'Google Drive, Dropbox'}] },
          { title: 'Créer compte utilisateur', sub: 'Inscription étape par étape', content: `<p><strong>Étapes pour créer un compte:</strong></p><ol class="step-list"><li>Ouvrir AfriPay et appuyer <strong>Inscription</strong>.</li><li>Entrer <strong>Nom complet</strong> et <strong>Téléphone</strong> avec indicatif.</li><li>Remplir <strong>Adresse</strong> et sélectionner <strong>Ville</strong>.</li><li>Choisir <strong>Pays</strong>.</li><li>Choisir <strong>Icône de profil</strong> ou télécharger image.</li><li>Appuyer <strong>Inscription</strong> – compte créé.</li><li>Se <strong>connecter</strong> avec nom et téléphone.</li></ol>`, steps: [{icon:'📱',title:'Ouvrir AfriPay',desc:'Appuyer Inscription'},{icon:'✏️',title:'Nom et Téléphone',desc:'Nom complet et téléphone avec indicatif'},{icon:'📍',title:'Adresse',desc:'Adresse et ville'},{icon:'🌍',title:'Pays',desc:'Choisir pays'},{icon:'🖼️',title:'Icône',desc:'Icône de profil ou image'},{icon:'✅',title:'Inscription',desc:'Appuyer Inscription – compte créé'},{icon:'🔑',title:'Connexion',desc:'Se connecter avec nom et téléphone'}] },
          { title: 'Créer compte agent (résumé)', sub: 'Inscription de l\'agent - résumé', content: `<p><strong>Étapes rapides pour créer un compte agent:</strong></p><ol class="step-list"><li>Appuyer <strong>Inscription</strong> puis <strong>Inscription agent</strong>.</li><li>Remplir <strong>Nom commercial, Adresse, Ville, N° enregistrement</strong>.</li><li>Sélectionner <strong>Type d\'entreprise</strong> et <strong>Nom du propriétaire</strong>.</li><li>Fournir <strong>Type ID et N° ID</strong> et télécharger photo.</li><li>Entrer <strong>N° Mobile Money</strong>.</li><li>Définir <strong>Limite de garantie</strong>, générer mot de passe et PIN.</li><li>Appuyer <strong>Générer USSD</strong>.</li><li>Lire et <strong>signer l\'accord</strong>.</li><li>Appuyer <strong>Inscrire agent</strong> – soumis pour approbation.</li></ol><p style="margin-top:0.4rem;">Pour un guide détaillé avec signature de l'accord, voir la page suivante.</p>`, steps: [{icon:'🏢',title:'Début',desc:'Inscription puis Inscription agent'},{icon:'📝',title:'Entreprise',desc:'Nom, adresse, ville, N° enregistrement'},{icon:'👤',title:'Propriétaire',desc:'Type d\'entreprise et nom'},{icon:'🪪',title:'ID',desc:'Type ID, N° ID, photo'},{icon:'📱',title:'Mobile Money',desc:'N° Mobile Money'},{icon:'🔐',title:'Sécurité',desc:'Limite de garantie, mot de passe, PIN'},{icon:'📞',title:'USSD',desc:'Générer USSD'},{icon:'✍️',title:'Accord',desc:'Lire et signer l\'accord'},{icon:'✅',title:'Soumettre',desc:'Inscrire agent – soumis'}] },
          { title: 'Détails de l\'inscription agent', sub: 'Guide complet incluant la signature de l\'accord', content: `<p><strong>Étapes détaillées pour créer un compte agent:</strong></p><ol class="step-list"><li>Ouvrir l\'application AfriPay et appuyer sur <strong>Inscription</strong>.</li><li>Sélectionner <strong>Inscription en tant qu\'agent</strong>.</li><li>Remplir <strong>Nom commercial</strong>, <strong>Adresse commerciale</strong>, <strong>Ville</strong>, et <strong>Numéro d\'enregistrement officiel</strong>.</li><li>Choisir le <strong>Type d\'entreprise</strong> et entrer le <strong>Nom complet du propriétaire</strong>.</li><li>Sélectionner le <strong>Type d\'ID</strong> et entrer le <strong>Numéro d\'ID</strong>. Télécharger une photo claire de votre ID.</li><li>Entrer votre <strong>Numéro Mobile Money</strong> (le numéro lié à votre compte Orange Money ou Afrimoney).</li><li>Définir une <strong>Limite de garantie</strong> (montant maximal de transaction). Générer un <strong>mot de passe de 6 caractères</strong> et un <strong>PIN de 5 chiffres</strong>.</li><li>Appuyer sur <strong>Générer USSD</strong> pour créer un code de paiement de garantie.</li><li><strong>Lire l\'accord d\'agent</strong> attentivement. Il décrit vos obligations, les taux de commission (7% sur les transferts, 12% sur les retraits) et la politique de garantie.</li><li><strong>Signer l\'accord</strong> en dessinant votre signature sur le canvas fourni dans l\'application.</li><li>Une fois signé, appuyer sur <strong>Inscrire l\'agent</strong> pour soumettre votre demande d\'approbation.</li><li>Vous recevrez une confirmation et votre compte sera activé après examen par l\'administrateur.</li></ol><p style="margin-top:0.4rem;">Les agents gagnent <strong>7% de commission</strong> sur les transferts et <strong>12%</strong> sur les retraits.</p>`, steps: [{icon:'📱',title:'Ouvrir & Inscription',desc:'Ouvrir AfriPay, appuyer Inscription, sélectionner Inscription agent'},{icon:'📝',title:'Détails entreprise',desc:'Nom commercial, adresse, ville, N° enregistrement'},{icon:'👤',title:'Propriétaire & type',desc:'Type d\'entreprise et nom complet'},{icon:'🪪',title:'Télécharger ID',desc:'Type ID, numéro ID, télécharger photo'},{icon:'📱',title:'Mobile Money',desc:'Entrer N° Mobile Money'},{icon:'🔐',title:'Sécurité',desc:'Limite de garantie, mot de passe 6 caractères, PIN 5 chiffres'},{icon:'📞',title:'Générer USSD',desc:'Générer USSD pour paiement de garantie'},{icon:'📜',title:'Lire accord',desc:'Lire attentivement l\'accord d\'agent'},{icon:'✍️',title:'Signer accord',desc:'Dessiner la signature sur le canvas'},{icon:'✅',title:'Soumettre',desc:'Appuyer Inscrire agent pour soumettre'}] },
          { title: 'Envoyer localement', sub: 'Guide de transfert local', content: `<p><strong>Comment envoyer localement:</strong></p><ol class="step-list"><li><strong>Connectez-vous</strong>.</li><li>Les <strong>détails de l\'expéditeur</strong> sont pré-remplis automatiquement depuis votre compte.</li><li>Sélectionnez un <strong>agent enregistré</strong>.</li><li>Entrez le <strong>montant</strong> – 4% de frais.</li><li>Sélectionnez l'<strong>opérateur</strong>.</li><li>Générez un <strong>code USSD</strong>.</li><li>Entrez votre <strong>PIN</strong>.</li><li>Recevez un <strong>reçu numérique</strong>.</li></ol>`, steps: [{icon:'🔑',title:'Connexion',desc:'Connectez-vous'},{icon:'✏️',title:'Expéditeur pré-rempli',desc:'Nom, téléphone, adresse et ville sont automatiquement remplis'},{icon:'👤',title:'Agent',desc:'Sélectionnez un agent enregistré'},{icon:'💰',title:'Montant',desc:'Entrez le montant – 4% de frais'},{icon:'📱',title:'Opérateur',desc:'Sélectionnez l\'opérateur'},{icon:'📞',title:'USSD',desc:'Générez un code USSD'},{icon:'🔐',title:'PIN',desc:'Entrez votre PIN'},{icon:'🧾',title:'Reçu',desc:'Recevez un reçu numérique'}] },
          { title: 'Envoyer internationalement', sub: 'Guide de transfert international', content: `<p><strong>Comment envoyer internationalement:</strong></p><ol class="step-list"><li><strong>Connectez-vous</strong>.</li><li>Les <strong>détails de l\'expéditeur</strong> sont pré-remplis automatiquement depuis votre compte.</li><li>Appuyez <strong>International</strong>.</li><li>Vérifiez la <strong>bande de drapeaux</strong> – sélectionnez agent correspondant.</li><li>Sélectionnez <strong>pays du destinataire</strong>.</li><li>Entrez le <strong>montant</strong> – 4% de frais + TVA.</li><li>Sélectionnez l'<strong>opérateur</strong>.</li><li>Générez un <strong>code USSD international</strong>.</li><li>Entrez votre <strong>PIN</strong>.</li><li>Recevez un <strong>reçu</strong> avec le taux de change.</li></ol>`, steps: [{icon:'🔑',title:'Connexion',desc:'Connectez-vous'},{icon:'✏️',title:'Expéditeur pré-rempli',desc:'Nom, téléphone, adresse et ville sont automatiquement remplis'},{icon:'🌍',title:'International',desc:'Appuyez International'},{icon:'🏳️',title:'Agent',desc:'Sélectionnez agent correspondant'},{icon:'🌍',title:'Pays',desc:'Sélectionnez pays du destinataire'},{icon:'💰',title:'Montant',desc:'Entrez le montant – 4% + TVA'},{icon:'📱',title:'Opérateur',desc:'Sélectionnez l\'opérateur'},{icon:'📞',title:'USSD',desc:'Générez un code USSD international'},{icon:'🔐',title:'PIN',desc:'Entrez votre PIN'},{icon:'🧾',title:'Reçu',desc:'Reçu avec taux de change'}] }
        ]

      es: {

          { title: 'Agente y Garantía', sub: 'Registro seguro de agentes', content: `<p><strong>Registro de agente</strong> requiere nombre comercial, ID y límite de garantía hasta 10,000.</p><p style="margin-top:0.4rem;">Garantía protege clientes. Si agente falla, desarrollador compensa.</p><p style="margin-top:0.4rem;">Agentes reciben <strong>7% de comisión</strong> en transferencias y <strong>12%</strong> en retiros.</p>`, steps: [{icon:'🏢',title:'Registro agente',desc:'Nombre comercial, ID, límite de garantía'},{icon:'🛡️',title:'Garantía',desc:'Protege clientes'},{icon:'📜',title:'Acuerdo',desc:'Acuerdo digital firmado'},{icon:'💰',title:'Comisión',desc:'7% transferencias, 12% retiros'}] },
          { title: 'Tasas y Recibos', sub: 'Conversor de divisas en tiempo real', content: `<p><strong>Conversor de divisas</strong> con tasas en vivo. Cargo: 4% transferencia + IVA.</p><p style="margin-top:0.4rem;">Recibo con ID transacción, ID proveedor, código transferencia.</p><p style="margin-top:0.4rem;">20+ países con códigos USSD dinámicos.</p>`, steps: [{icon:'💱',title:'Conversor',desc:'Tasas en vivo con USD'},{icon:'📊',title:'Cargos',desc:'4% transferencia + IVA'},{icon:'🧾',title:'Recibo',desc:'ID transacción, código transferencia'},{icon:'🌍',title:'Países',desc:'20+ países con códigos USSD'}] },
          { title: 'Obtener AfriPay', sub: 'Descargar e instalar', content: `<p><strong>Cómo obtener AfriPay:</strong></p><div class="action-btn-group"><button class="action-btn nusapp" id="nusappBtn">📦 NUSAPPSTORE</button><button class="action-btn whatsapp" id="whatsappBtn">💬 WhatsApp</button><button class="action-btn xender" id="xenderBtn">📤 Xender</button><button class="action-btn bluetooth" id="bluetoothBtn">📡 Bluetooth</button><button class="action-btn usb" id="usbBtn">📁 USB</button><button class="action-btn cloud" id="cloudBtn">☁️ Cloud</button></div><ul class="step-list"><li><strong>NUSAPPSTORE</strong> – descargue NUSAPPSTORE luego AfriPay.</li><li><strong>WhatsApp</strong> – mensaje a <strong>+23276436811</strong> para APK.</li><li><strong>Xender</strong> – transferencia directa.</li><li><strong>Bluetooth</strong> – compartir archivo.</li><li><strong>USB o OTG</strong> – copiar desde USB.</li><li><strong>Cloud</strong> – Google Drive, Dropbox.</li></ul>`, steps: [{icon:'📦',title:'NUSAPPSTORE',desc:'Descargar NUSAPPSTORE luego AfriPay'},{icon:'💬',title:'WhatsApp',desc:'Mensaje a +23276436811'},{icon:'📤',title:'Xender',desc:'Transferencia directa'},{icon:'📡',title:'Bluetooth',desc:'Compartir archivo'},{icon:'📁',title:'USB',desc:'Copiar desde USB'},{icon:'☁️',title:'Cloud',desc:'Google Drive, Dropbox'}] },
          { title: 'Crear cuenta usuario', sub: 'Registro paso a paso', content: `<p><strong>Pasos para crear cuenta:</strong></p><ol class="step-list"><li>Abrir AfriPay y tocar <strong>Registrarse</strong>.</li><li>Ingresar <strong>Nombre completo</strong> y <strong>Teléfono</strong> con código.</li><li>Completar <strong>Dirección</strong> y seleccionar <strong>Ciudad</strong>.</li><li>Elegir <strong>País</strong>.</li><li>Elegir <strong>Icono de perfil</strong> o cargar imagen.</li><li>Tocar <strong>Registrarse</strong> – cuenta creada.</li><li><strong>Iniciar sesión</strong> con nombre y teléfono.</li></ol>`, steps: [{icon:'📱',title:'Abrir AfriPay',desc:'Tocar Registrarse'},{icon:'✏️',title:'Nombre y Teléfono',desc:'Nombre completo y teléfono con código'},{icon:'📍',title:'Dirección',desc:'Dirección y ciudad'},{icon:'🌍',title:'País',desc:'Elegir país'},{icon:'🖼️',title:'Icono',desc:'Icono de perfil o imagen'},{icon:'✅',title:'Registrarse',desc:'Tocar Registrarse – cuenta creada'},{icon:'🔑',title:'Iniciar sesión',desc:'Iniciar sesión con nombre y teléfono'}] },
          { title: 'Crear cuenta agente (resumen)', sub: 'Registro de agente - resumen', content: `<p><strong>Pasos rápidos para crear cuenta agente:</strong></p><ol class="step-list"><li>Tocar <strong>Registrarse</strong> luego <strong>Registrarse como agente</strong>.</li><li>Completar <strong>Nombre comercial, Dirección, Ciudad, N° registro</strong>.</li><li>Seleccionar <strong>Tipo de negocio</strong> y <strong>Nombre del propietario</strong>.</li><li>Proporcionar <strong>Tipo ID y N° ID</strong>, cargar foto.</li><li>Ingresar <strong>N° Mobile Money</strong>.</li><li>Definir <strong>Límite de garantía</strong>, generar contraseña y PIN.</li><li>Tocar <strong>Generar USSD</strong>.</li><li>Leer y <strong>firmar acuerdo</strong>.</li><li>Tocar <strong>Registrar agente</strong> – enviado para aprobación.</li></ol><p style="margin-top:0.4rem;">Para una guía detallada con la firma del acuerdo, ver la página siguiente.</p>`, steps: [{icon:'🏢',title:'Inicio',desc:'Registrarse luego Registrarse como agente'},{icon:'📝',title:'Empresa',desc:'Nombre, dirección, ciudad, N° registro'},{icon:'👤',title:'Propietario',desc:'Tipo de negocio y nombre'},{icon:'🪪',title:'ID',desc:'Tipo ID, N° ID, foto'},{icon:'📱',title:'Mobile Money',desc:'N° Mobile Money'},{icon:'🔐',title:'Seguridad',desc:'Límite de garantía, contraseña, PIN'},{icon:'📞',title:'USSD',desc:'Generar USSD'},{icon:'✍️',title:'Acuerdo',desc:'Leer y firmar acuerdo'},{icon:'✅',title:'Enviar',desc:'Registrar agente – enviado'}] },
          { title: 'Detalles de registro de agente', sub: 'Guía completa incluyendo firma del acuerdo', content: `<p><strong>Pasos detallados para crear una cuenta de agente:</strong></p><ol class="step-list"><li>Abrir la aplicación AfriPay y tocar <strong>Registrarse</strong>.</li><li>Seleccionar <strong>Registrarse como agente</strong>.</li><li>Completar <strong>Nombre comercial</strong>, <strong>Dirección comercial</strong>, <strong>Ciudad</strong>, y <strong>Número de registro oficial</strong>.</li><li>Elegir el <strong>Tipo de negocio</strong> e ingresar el <strong>Nombre completo del propietario</strong>.</li><li>Seleccionar el <strong>Tipo de ID</strong> e ingresar el <strong>Número de ID</strong>. Cargar una foto clara de su ID.</li><li>Ingresar su <strong>Número de Mobile Money</strong> (el número vinculado a su cuenta de Orange Money o Afrimoney).</li><li>Establecer un <strong>Límite de garantía</strong> (monto máximo de transacción). Generar una <strong>contraseña de 6 caracteres</strong> y un <strong>PIN de 5 dígitos</strong>.</li><li>Tocar <strong>Generar USSD</strong> para crear un código de pago de garantía.</li><li><strong>Leer el acuerdo de agente</strong> cuidadosamente. Describe sus obligaciones, tasas de comisión (7% en transferencias, 12% en retiros) y la política de garantía.</li><li><strong>Firmar el acuerdo</strong> dibujando su firma en el lienzo proporcionado en la aplicación.</li><li>Una vez firmado, tocar <strong>Registrar agente</strong> para enviar su solicitud de aprobación.</li><li>Recibirá una confirmación y su cuenta será activada después de la revisión del administrador.</li></ol><p style="margin-top:0.4rem;">Los agentes ganan <strong>7% de comisión</strong> en transferencias y <strong>12%</strong> en retiros.</p>`, steps: [{icon:'📱',title:'Abrir y Registrarse',desc:'Abrir AfriPay, tocar Registrarse, seleccionar Registrarse como agente'},{icon:'📝',title:'Detalles del negocio',desc:'Nombre comercial, dirección, ciudad, N° registro'},{icon:'👤',title:'Propietario y tipo',desc:'Tipo de negocio y nombre completo'},{icon:'🪪',title:'Cargar ID',desc:'Tipo ID, número ID, cargar foto'},{icon:'📱',title:'Mobile Money',desc:'Ingresar N° Mobile Money'},{icon:'🔐',title:'Seguridad',desc:'Límite de garantía, contraseña 6 caracteres, PIN 5 dígitos'},{icon:'📞',title:'Generar USSD',desc:'Generar USSD para pago de garantía'},{icon:'📜',title:'Leer acuerdo',desc:'Leer atentamente el acuerdo de agente'},{icon:'✍️',title:'Firmar acuerdo',desc:'Dibujar la firma en el lienzo'},{icon:'✅',title:'Enviar',desc:'Tocar Registrar agente para enviar'}] },
          { title: 'Enviar localmente', sub: 'Guía de transferencia local', content: `<p><strong>Cómo enviar localmente:</strong></p><ol class="step-list"><li><strong>Iniciar sesión</strong>.</li><li>Los <strong>datos del remitente</strong> se rellenan automáticamente desde tu cuenta.</li><li>Seleccionar <strong>agente registrado</strong>.</li><li>Ingresar <strong>monto</strong> – 4% de cargo.</li><li>Seleccionar <strong>operador</strong>.</li><li>Generar <strong>código USSD</strong>.</li><li>Ingresar <strong>PIN</strong>.</li><li>Recibir <strong>recibo digital</strong>.</li></ol>`, steps: [{icon:'🔑',title:'Iniciar sesión',desc:'Iniciar sesión'},{icon:'✏️',title:'Remitente pre-llenado',desc:'Nombre, teléfono, dirección y ciudad se rellenan automáticamente'},{icon:'👤',title:'Agente',desc:'Seleccionar agente registrado'},{icon:'💰',title:'Monto',desc:'Ingresar monto – 4% de cargo'},{icon:'📱',title:'Operador',desc:'Seleccionar operador'},{icon:'📞',title:'USSD',desc:'Generar código USSD'},{icon:'🔐',title:'PIN',desc:'Ingresar PIN'},{icon:'🧾',title:'Recibo',desc:'Recibir recibo digital'}] },
          { title: 'Enviar internacionalmente', sub: 'Guía de transferencia internacional', content: `<p><strong>Cómo enviar internacionalmente:</strong></p><ol class="step-list"><li><strong>Iniciar sesión</strong>.</li><li>Los <strong>datos del remitente</strong> se rellenan automáticamente desde tu cuenta.</li><li>Tocar <strong>Internacional</strong>.</li><li>Revisar <strong>banda de banderas</strong> – seleccionar agente correspondiente.</li><li>Seleccionar <strong>país del destinatario</strong>.</li><li>Ingresar <strong>monto</strong> – 4% de cargo + IVA.</li><li>Seleccionar <strong>operador</strong>.</li><li>Generar <strong>código USSD internacional</strong>.</li><li>Ingresar <strong>PIN</strong>.</li><li>Recibir <strong>recibo</strong> con tipo de cambio.</li></ol>`, steps: [{icon:'🔑',title:'Iniciar sesión',desc:'Iniciar sesión'},{icon:'✏️',title:'Remitente pre-llenado',desc:'Nombre, teléfono, dirección y ciudad se rellenan automáticamente'},{icon:'🌍',title:'Internacional',desc:'Tocar Internacional'},{icon:'🏳️',title:'Agente',desc:'Seleccionar agente correspondiente'},{icon:'🌍',title:'País',desc:'Seleccionar país del destinatario'},{icon:'💰',title:'Monto',desc:'Ingresar monto – 4% + IVA'},{icon:'📱',title:'Operador',desc:'Seleccionar operador'},{icon:'📞',title:'USSD',desc:'Generar código USSD internacional'},{icon:'🔐',title:'PIN',desc:'Ingresar PIN'},{icon:'🧾',title:'Recibo',desc:'Recibo con tipo de cambio'}] }
        ]
      }
    };

    // ---------- STATE ----------
    let currentIndex = 0;
    const total = 9; // Updated to 9 pages
    let currentLang = 'en';
    let speechSynth = window.speechSynthesis;
    let currentUtterance = null;
    let isSpeaking = false;
    let typingInterval = null;
    let typewriterTimeout = null;
    let isTypingComplete = false;

    // Slideshow state
    let slideSteps = [];
    let slideIndex = 0;
    let slideInterval = null;
    let isSlidePlaying = false;
    let slideVoiceUtterance = null;
    let slideVoiceSpeaking = false;

    // DOM refs
    const titleEl = document.getElementById('pageTitle');
    const subEl = document.getElementById('pageSub');
    const contentEl = document.getElementById('pageContent');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageCounter = document.getElementById('pageCounter');
    const dotsContainer = document.getElementById('stepDots');
    const playBtn = document.getElementById('playAudioBtn');
    const videoBtn = document.getElementById('playVideoBtn');
    const langSelect = document.getElementById('audioLangSelect');
    const audioStatus = document.getElementById('audioStatus');
    const videoOverlay = document.getElementById('videoOverlay');

    // Slide DOM
    const slideStepCounter = document.getElementById('slideStepCounter');
    const slideProgressFill = document.getElementById('slideProgressFill');
    const slideIcon = document.getElementById('slideIcon');
    const slideTitle = document.getElementById('slideTitle');
    const slideDesc = document.getElementById('slideDesc');
    const slideDots = document.getElementById('slideDots');
    const slidePrevBtn = document.getElementById('slidePrevBtn');
    const slideNextBtn = document.getElementById('slideNextBtn');
    const slidePlayBtn = document.getElementById('slidePlayBtn');
    const slideCloseBtn = document.getElementById('slideCloseBtn');
    const slideVoiceStatus = document.getElementById('slideVoiceStatus');
    const slideLangDisplay = document.getElementById('slideLangDisplay');

    // ---------- BUILD DOTS ----------
    function buildDots() {
      dotsContainer.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('span');
        dot.className = 'step-dot';
        dot.dataset.index = i;
        dotsContainer.appendChild(dot);
      }
    }
    buildDots();
    const dots = document.querySelectorAll('.step-dot');

    // ---------- GET PAGE DATA ----------
    function getPageData(index) {
      const langData = translations[currentLang] || translations.en;
      return langData.pages[index] || langData.pages[0];
    }

    // ---------- TYPEWRITER ----------
    function startTypewriter(htmlContent) {
      stopTypewriter();
      isTypingComplete = false;
      contentEl.innerHTML = '<span class="typing-cursor"></span>';
      contentEl.classList.add('animating');

      const tokens = parseHTMLTokens(htmlContent);
      let currentTokenIndex = 0;
      let accumulatedHTML = '';

      function typeNextChar() {
        if (currentTokenIndex >= tokens.length) {
          isTypingComplete = true;
          contentEl.innerHTML = htmlContent;
          contentEl.classList.remove('animating');
          return;
        }
        const token = tokens[currentTokenIndex];
        if (token.type === 'tag') {
          accumulatedHTML += token.content;
          currentTokenIndex++;
          typeNextChar();
          return;
        } else if (token.type === 'text') {
          const text = token.content;
          let charIndex = 0;
          const interval = setInterval(() => {
            if (charIndex < text.length) {
              accumulatedHTML += text[charIndex];
              charIndex++;
              contentEl.innerHTML = accumulatedHTML + '<span class="typing-cursor"></span>';
              contentEl.scrollTop = contentEl.scrollHeight;
            } else {
              clearInterval(interval);
              currentTokenIndex++;
              typeNextChar();
            }
          }, 30);
          return;
        }
      }
      typeNextChar();
    }

    function parseHTMLTokens(html) {
      const tokens = [];
      let i = 0;
      while (i < html.length) {
        if (html[i] === '<') {
          let j = html.indexOf('>', i);
          if (j === -1) break;
          tokens.push({ type: 'tag', content: html.substring(i, j + 1) });
          i = j + 1;
        } else {
          let j = html.indexOf('<', i);
          if (j === -1) j = html.length;
          const text = html.substring(i, j);
          if (text.length > 0) tokens.push({ type: 'text', content: text });
          i = j;
        }
      }
      return tokens;
    }

    function stopTypewriter() {
      if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
      if (typewriterTimeout) { clearTimeout(typewriterTimeout); typewriterTimeout = null; }
      contentEl.classList.remove('animating');
      const cursor = contentEl.querySelector('.typing-cursor');
      if (cursor) cursor.remove();
    }

    // ---------- RENDER PAGE ----------
    function renderPage(index, animate = true) {
      const page = getPageData(index);
      titleEl.textContent = page.title;
      subEl.textContent = page.sub;

      if (isSpeaking) { speechSynth.cancel(); isSpeaking = false; audioStatus.textContent = 'Stopped'; playBtn.disabled = false; }
      stopTypewriter();

      if (animate) startTypewriter(page.content);
      else { contentEl.innerHTML = page.content; isTypingComplete = true; }

      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
      pageCounter.textContent = `${index+1} / ${total}`;
      prevBtn.disabled = index === 0;
      nextBtn.textContent = index === total - 1 ? '✨ Done' : 'Next ▶';
      audioStatus.textContent = 'Ready';
      playBtn.disabled = false;
      videoBtn.disabled = false;

      if (index === 3) attachActionButtons();
    }

    // ---------- ACTION BUTTONS ----------
    function attachActionButtons() {
      const nusappBtn = document.getElementById('nusappBtn');
      if (nusappBtn) nusappBtn.onclick = () => window.open('https://nusappstore.com', '_blank');
      const whatsappBtn = document.getElementById('whatsappBtn');
      if (whatsappBtn) whatsappBtn.onclick = () => window.open('https://wa.me/23276436811', '_blank');
      const xenderBtn = document.getElementById('xenderBtn');
      if (xenderBtn) xenderBtn.onclick = () => {
        window.location.href = 'xender://';
        setTimeout(() => window.open('https://play.google.com/store/apps/details?id=com.xender', '_blank'), 500);
      };
      const bluetoothBtn = document.getElementById('bluetoothBtn');
      if (bluetoothBtn) bluetoothBtn.onclick = () => {
        if (navigator.bluetooth && navigator.bluetooth.requestDevice) {
          navigator.bluetooth.requestDevice({ acceptAllDevices: true }).catch(() => {});
        } else {
          window.location.href = 'intent://settings/bluetooth/#Intent;action=android.settings.BLUETOOTH_SETTINGS;end';
        }
      };
      const usbBtn = document.getElementById('usbBtn');
      if (usbBtn) usbBtn.onclick = () => showToast('Plug in a USB drive or OTG cable to transfer the APK file.');
      const cloudBtn = document.getElementById('cloudBtn');
      if (cloudBtn) cloudBtn.onclick = () => showToast('Share via Google Drive, Dropbox, or any cloud service.');
    }

    function showToast(msg) {
      audioStatus.textContent = 'ℹ️ ' + msg;
      setTimeout(() => { if (audioStatus.textContent === 'ℹ️ ' + msg) audioStatus.textContent = 'Ready'; }, 3000);
    }

    // ---------- NAVIGATION ----------
    function goTo(index) {
      if (index < 0 || index >= total) return;
      currentIndex = index;
      renderPage(currentIndex, true);
    }

    prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
    nextBtn.addEventListener('click', () => {
      if (currentIndex === total - 1) {
        audioStatus.textContent = '🎉 Guide complete!';
        playBtn.disabled = true;
        videoBtn.disabled = true;
        if (isSpeaking) { speechSynth.cancel(); isSpeaking = false; }
        return;
      }
      goTo(currentIndex + 1);
    });

    // ---------- SPEECH ----------
    function stripIcons(text) {
      return text.replace(/[\u{1F000}-\u{1FFFF}]|[\u2600-\u27BF]|[\u{1F300}-\u{1F5FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{1FB00}-\u{1FBFF}]|[\u{1FC00}-\u{1FCFF}]|[\u{1FD00}-\u{1FDFF}]|[\u{1FE00}-\u{1FEFF}]|[\u{1FF00}-\u{1FFFF}]|[☀-⛿]|[✀-➿]|[🌐-🏿]|[🍀-🧿]|[🀀-🿿]|[😀-🙏]|[🚀-🛿]|[🜀-🝿]|[🞀-🟿]|[🤀-🫿]/gu, '');
    }

    function buildSpeechText(pageIndex) {
      const page = getPageData(pageIndex);
      const tmp = document.createElement('div');
      tmp.innerHTML = page.content;
      let plainText = tmp.textContent || tmp.innerText || '';
      plainText = stripIcons(plainText);
      plainText = plainText.replace(/\s+/g, ' ').trim();
      plainText = plainText.replace(/\+23276436811/g, 'plus two three two seven six four three six eight one one');
      plainText = plainText.replace(/23276436811/g, 'two three two seven six four three six eight one one');
      return `${page.title}. ${page.sub}. ${plainText}`;
    }

    function speakPage(langCode) {
      if (isSpeaking) {
        speechSynth.cancel();
        isSpeaking = false;
        playBtn.disabled = false;
        audioStatus.textContent = 'Stopped';
        setTimeout(() => speakPage(langCode), 150);
        return;
      }
      const text = buildSpeechText(currentIndex);
      if (!text || text.trim().length < 5) { audioStatus.textContent = '⚠️ No text'; return; }
      const langMap = { 'en': 'en-US', 'ar': 'ar-SA', 'fr': 'fr-FR', 'es': 'es-ES' };
      const voiceLang = langMap[langCode] || 'en-US';
      speechSynth.cancel();
      if (!isTypingComplete) {
        stopTypewriter();
        const page = getPageData(currentIndex);
        startTypewriter(page.content);
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = voiceLang;
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      utterance.volume = 1;
      const voices = speechSynth.getVoices();
      const preferred = voices.find(v => v.lang.startsWith(voiceLang.substring(0,2)));
      if (preferred) utterance.voice = preferred;
      currentUtterance = utterance;
      isSpeaking = true;
      playBtn.disabled = true;
      audioStatus.textContent = '🔊 Speaking...';
      contentEl.classList.add('animating');
      utterance.onend = function() {
        isSpeaking = false;
        playBtn.disabled = false;
        audioStatus.textContent = '✅ Done';
        contentEl.classList.remove('animating');
        currentUtterance = null;
        if (!isTypingComplete) {
          const page = getPageData(currentIndex);
          contentEl.innerHTML = page.content;
          isTypingComplete = true;
          contentEl.classList.remove('animating');
        }
      };
      utterance.onerror = function() {
        isSpeaking = false;
        playBtn.disabled = false;
        audioStatus.textContent = '⚠️ Error';
        contentEl.classList.remove('animating');
        currentUtterance = null;
      };
      speechSynth.speak(utterance);
      setTimeout(() => {
        if (isSpeaking && !speechSynth.speaking) {
          isSpeaking = false;
          playBtn.disabled = false;
          audioStatus.textContent = '⚠️ Retry';
          contentEl.classList.remove('animating');
          speechSynth.cancel();
        }
      }, 3000);
    }

    playBtn.addEventListener('click', function() {
      const lang = langSelect.value;
      currentLang = lang;
      speakPage(lang);
    });

    langSelect.addEventListener('change', function() {
      currentLang = this.value;
      if (!isSpeaking) renderPage(currentIndex, true);
      else {
        speechSynth.cancel(); isSpeaking = false; playBtn.disabled = false;
        audioStatus.textContent = 'Stopped';
        stopTypewriter();
        renderPage(currentIndex, true);
      }
    });

    // ---------- SLIDESHOW WITH VOICE NARRATION (AUTO-PLAY) ----------
    function getSlideSteps(index) {
      const page = getPageData(index);
      return page.steps || [{ icon: '📱', title: 'Welcome', desc: 'Loading...' }];
    }

    function renderSlide(stepIdx) {
      const steps = slideSteps;
      if (!steps || steps.length === 0) return;
      const step = steps[stepIdx] || steps[0];
      slideIcon.textContent = step.icon || '📱';
      slideTitle.textContent = step.title || 'Step';
      slideDesc.textContent = step.desc || '';
      slideStepCounter.textContent = `Step ${stepIdx+1} of ${steps.length}`;
      slideProgressFill.style.width = `${((stepIdx+1)/steps.length)*100}%`;

      // Update dots
      const dots = slideDots.querySelectorAll('.slide-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === stepIdx);
      });

      // Update voice status
      const langNames = { 'en': '🇬🇧 English', 'ar': '🇸🇦 العربية', 'fr': '🇫🇷 Français', 'es': '🇪🇸 Español' };
      slideLangDisplay.textContent = langNames[currentLang] || '🇬🇧 English';
    }

    function speakSlideStep(stepIdx) {
      const steps = slideSteps;
      if (!steps || stepIdx >= steps.length) return;
      const step = steps[stepIdx];
      const text = `${step.title}. ${step.desc}`;

      // Cancel any ongoing speech
      if (slideVoiceUtterance) {
        speechSynth.cancel();
        slideVoiceUtterance = null;
        slideVoiceSpeaking = false;
      }

      const langMap = { 'en': 'en-US', 'ar': 'ar-SA', 'fr': 'fr-FR', 'es': 'es-ES' };
      const voiceLang = langMap[currentLang] || 'en-US';

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = voiceLang;
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      utterance.volume = 1;
      const voices = speechSynth.getVoices();
      const preferred = voices.find(v => v.lang.startsWith(voiceLang.substring(0,2)));
      if (preferred) utterance.voice = preferred;

      slideVoiceUtterance = utterance;
      slideVoiceSpeaking = true;
      slideVoiceStatus.textContent = '🔊 Speaking step...';

      utterance.onend = function() {
        slideVoiceSpeaking = false;
        slideVoiceUtterance = null;
        slideVoiceStatus.textContent = '✅ Voice done';
        // Auto advance if playing
        if (isSlidePlaying) {
          setTimeout(() => {
            if (isSlidePlaying) {
              goToSlide((slideIndex + 1) % slideSteps.length);
            }
          }, 800);
        }
      };
      utterance.onerror = function() {
        slideVoiceSpeaking = false;
        slideVoiceUtterance = null;
        slideVoiceStatus.textContent = '⚠️ Voice error';
      };
      speechSynth.speak(utterance);
    }

    function goToSlide(idx) {
      if (!slideSteps || slideSteps.length === 0) return;
      slideIndex = (idx + slideSteps.length) % slideSteps.length;
      renderSlide(slideIndex);
      // Speak the step
      speakSlideStep(slideIndex);
    }

    function toggleSlidePlay() {
      if (isSlidePlaying) {
        isSlidePlaying = false;
        slidePlayBtn.textContent = '▶ Play';
        if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
        if (slideVoiceUtterance) {
          speechSynth.cancel();
          slideVoiceUtterance = null;
          slideVoiceSpeaking = false;
          slideVoiceStatus.textContent = '⏸️ Paused';
        }
      } else {
        isSlidePlaying = true;
        slidePlayBtn.textContent = '⏸ Pause';
        // If at last step, go to first
        if (slideIndex === slideSteps.length - 1) {
          slideIndex = -1;
        }
        // Auto advance every 4 seconds
        if (slideInterval) clearInterval(slideInterval);
        slideInterval = setInterval(() => {
          if (isSlidePlaying && slideSteps.length > 0) {
            const nextIdx = (slideIndex + 1) % slideSteps.length;
            goToSlide(nextIdx);
          }
        }, 4500);
        // Start speaking current step
        speakSlideStep(slideIndex);
      }
    }

    function openSlideshow() {
      // Close any ongoing audio
      if (isSpeaking) {
        speechSynth.cancel();
        isSpeaking = false;
        playBtn.disabled = false;
        audioStatus.textContent = 'Stopped';
      }

      slideSteps = getSlideSteps(currentIndex);
      if (!slideSteps || slideSteps.length === 0) {
        slideSteps = [{ icon: '📱', title: 'No steps', desc: 'No content available' }];
      }
      slideIndex = 0;
      // Start playing immediately
      isSlidePlaying = true;
      if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }

      // Build dots
      slideDots.innerHTML = '';
      slideSteps.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', function() {
          if (isSlidePlaying) toggleSlidePlay();
          goToSlide(i);
        });
        slideDots.appendChild(dot);
      });

      renderSlide(0);
      slidePlayBtn.textContent = '⏸ Pause';
      slideVoiceStatus.textContent = '🔊 Ready';
      videoOverlay.classList.add('open');

      // Auto-advance interval
      slideInterval = setInterval(() => {
        if (isSlidePlaying && slideSteps.length > 0) {
          const nextIdx = (slideIndex + 1) % slideSteps.length;
          goToSlide(nextIdx);
        }
      }, 4500);

      // Speak first step after a short delay
      setTimeout(() => {
        if (videoOverlay.classList.contains('open')) {
          speakSlideStep(0);
        }
      }, 500);
    }

    function closeSlideshow() {
      isSlidePlaying = false;
      if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
      if (slideVoiceUtterance) {
        speechSynth.cancel();
        slideVoiceUtterance = null;
        slideVoiceSpeaking = false;
      }
      videoOverlay.classList.remove('open');
      slideVoiceStatus.textContent = '🔊 Voice narration ready';
      slidePlayBtn.textContent = '▶ Play';
    }

    // Slide controls
    slidePrevBtn.addEventListener('click', () => {
      if (isSlidePlaying) toggleSlidePlay();
      goToSlide(slideIndex - 1);
    });
    slideNextBtn.addEventListener('click', () => {
      if (isSlidePlaying) toggleSlidePlay();
      goToSlide(slideIndex + 1);
    });
    slidePlayBtn.addEventListener('click', toggleSlidePlay);
    slideCloseBtn.addEventListener('click', closeSlideshow);
    videoOverlay.addEventListener('click', function(e) {
      if (e.target === this) closeSlideshow();
    });

    // Keyboard controls for slideshow
    document.addEventListener('keydown', function(e) {
      if (!videoOverlay.classList.contains('open')) return;
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        if (isSlidePlaying) toggleSlidePlay();
        goToSlide(slideIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (isSlidePlaying) toggleSlidePlay();
        goToSlide(slideIndex - 1);
      } else if (e.key === 'Escape') {
        closeSlideshow();
      }
    });

    videoBtn.addEventListener('click', openSlideshow);

    // ---------- VOICE LIST LOAD ----------
    if (speechSynth) {
      speechSynth.getVoices();
      speechSynth.onvoiceschanged = () => { speechSynth.getVoices(); };
    }

    // ---------- INIT ----------
    renderPage(0, true);

    window.addEventListener('beforeunload', function() {
      if (speechSynth) speechSynth.cancel();
      stopTypewriter();
      if (slideInterval) clearInterval(slideInterval);
      if (slideVoiceUtterance) speechSynth.cancel();
    });

    const originalGoTo = goTo;
    goTo = function(index) {
      if (isSpeaking) {
        speechSynth.cancel();
        isSpeaking = false;
        audioStatus.textContent = 'Stopped';
        playBtn.disabled = false;
      }
      stopTypewriter();
      if (videoOverlay.classList.contains('open')) closeSlideshow();
      originalGoTo(index);
    };
    prevBtn.removeEventListener('click', () => goTo(currentIndex - 1));
    nextBtn.removeEventListener('click', () => goTo(currentIndex + 1));
    prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
    nextBtn.addEventListener('click', () => {
      if (currentIndex === total - 1) {
        audioStatus.textContent = '🎉 Guide complete!';
        playBtn.disabled = true;
        videoBtn.disabled = true;
        if (isSpeaking) { speechSynth.cancel(); isSpeaking = false; }
        return;
      }
      goTo(currentIndex + 1);
    });

    window.addEventListener('load', function() {
      if (speechSynth) speechSynth.getVoices();
      renderPage(currentIndex, true);
      attachActionButtons();
    });

  })();
</script>
</body>
</html>
